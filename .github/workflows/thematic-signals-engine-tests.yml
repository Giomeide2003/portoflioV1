name: Thematic Signals Engine tests

on:
  push:
    paths:
      - "projects/thematic-signals-engine/**"
      - ".github/workflows/thematic-signals-engine-tests.yml"
  pull_request:
    paths:
      - "projects/thematic-signals-engine/**"
      - ".github/workflows/thematic-signals-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/thematic-signals-engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/thematic-signals-engine/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q
